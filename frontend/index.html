<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#044875" />
    <meta name="description" content="RightWay Centre of Learning — School Management Workstation" />
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RightWay" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Android PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="The RightWay Centre of Learning" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>The RightWay Centre of Learning</title>
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://wipaycaribbean.com https://accounts.google.com https://demobackend.emergentagent.com; frame-src https://www.google.com/maps/ https://maps.google.com/ https://www.google.com/; frame-ancestors 'none';" />
    <script>
      // Suppress DataCloneError noise from PerformanceServerTiming
      window.addEventListener("error", function(e) {
        if (e.error instanceof DOMException && e.error.name === "DataCloneError" &&
            e.message && e.message.includes("PerformanceServerTiming")) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);

      // Detect PWA standalone mode
      if (window.navigator.standalone || window.matchMedia("(display-mode: standalone)").matches) {
        document.documentElement.classList.add("pwa-standalone");
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
